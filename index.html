
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los misterios de Macondo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px 40px;
  font-family: Georgia, "Times New Roman", serif;
  background: #fff8e8;
  color: #59452e;
  text-align: center;
}

header {
  max-width: 650px;
  margin: 20px auto 30px;
}

.mariposas {
  font-size: 34px;
  letter-spacing: 8px;
  animation: flotar 3s ease-in-out infinite;
}

h1 {
  color: #b78519;
  font-size: clamp(30px, 8vw, 43px);
  margin-bottom: 10px;
}

.subtitulo {
  font-size: 17px;
  line-height: 1.6;
}

.decoracion {
  color: #d5a52f;
  font-size: 20px;
  margin-top: 18px;
}

.card {
  max-width: 500px;
  margin: 22px auto;
  padding: 24px 20px;
  background: #fffefa;
  border: 1px solid #eddfbd;
  border-radius: 20px;
  box-shadow: 0 5px 18px #bda97735;
  text-align: center;
}

.numero {
  color: #b78519;
  font-size: 13px;
  letter-spacing: 2px;
  font-weight: bold;
}

h2 {
  font-size: 22px;
  color: #84601d;
}

.pregunta {
  font-size: 16px;
  line-height: 1.8;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #f3df9e;
  color: #59452e;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.boton-pista {
  background: #f9edc9;
}

.boton-respuesta {
  background: #e8c76e;
}

.pista, .respuesta {
  display: none;
  margin-top: 14px;
  padding: 14px;
  border-radius: 12px;
  line-height: 1.7;
}

.pista {
  background: #fff5d7;
  border: 1px dashed #d5ad4b;
}

.respuesta {
  background: #edf2d8;
  color: #46572c;
  font-weight: bold;
}

footer {
  margin: 35px auto 10px;
  font-size: 14px;
  line-height: 1.8;
  color: #97794a;
}

@keyframes flotar {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
</style>
</head>

<body>

<header>
  <div class="mariposas">🦋 🌼 🦋</div>
  <h1>Los misterios de Macondo</h1>
  <p class="subtitulo">
    Seis enigmas inspirados en
    <i>Cien años de soledad</i>, de Gabriel García Márquez.
  </p>
  <p class="decoracion">✦ Pon a prueba tu memoria literaria ✦</p>
</header>

<main id="juego"></main>

<footer>
  🌼 Cada misterio esconde un secreto 🌼<br>
  ¿Podrás descubrirlos todos?
</footer>

<script>
const preguntas = [
{
  pregunta: "Intenté descifrar los secretos del mundo mediante experimentos e inventos, pero terminé alejándome de la realidad. Fui el origen de una estirpe condenada a repetirse. ¿Quién soy?",
  pistas: [
    "Mi obsesión por la alquimia y los inventos me llevó a aislarme.",
    "Fundé Macondo y fui esposo de Úrsula Iguarán."
  ],
  respuesta: "José Arcadio Buendía"
},
{
  pregunta: "Aunque el tiempo parecía pasar para todos, permanecí como una fuerza constante dentro de una familia marcada por el destino. Mi longevidad me permitió ver repetirse sus errores. ¿Quién soy?",
  pistas: [
    "Mi vida estuvo ligada a la crianza de varias generaciones de los Buendía.",
    "Soy la esposa de José Arcadio Buendía y luché por mantener unida a la familia."
  ],
  respuesta: "Úrsula Iguarán"
},
{
  pregunta: "Llegué desde fuera del pueblo trayendo objetos que parecían desafiar lo conocido. Dejé un legado escrito cuyo significado solo podría comprenderse plenamente cuando llegara el momento indicado. ¿Quién soy?",
  pistas: [
    "Mis conocimientos y mis visitas despiertan la curiosidad de José Arcadio Buendía.",
    "Soy el gitano que escribe los manuscritos descifrados por Aureliano Babilonia."
  ],
  respuesta: "Melquíades"
},
{
  pregunta: "Nací como un lugar apartado del mundo, pero terminé convertido en el escenario de acontecimientos extraordinarios. Mi historia parece avanzar y retroceder al mismo tiempo, como si el destino ya estuviera escrito. ¿Qué soy?",
  pistas: [
    "Mi fundador soñó con una ciudad de paredes de hielo.",
    "Soy el pueblo ficticio creado por Gabriel García Márquez donde vive la familia Buendía."
  ],
  respuesta: "Macondo"
},
{
  pregunta: "Mi presencia anunciaba un amor que no podía pasar inadvertido. No hablaba ni tomaba decisiones, pero mi aparición seguía a un hombre y revelaba su pasión. ¿Qué soy?",
  pistas: [
    "Mi color es el mismo que el de muchos girasoles.",
    "Acompaño a Mauricio Babilonia y estoy relacionada con su amor por Meme."
  ],
  respuesta: "Las mariposas amarillas"
},
{
  pregunta: "Mi llegada alteró la vida cotidiana de un pueblo: primero desapareció una necesidad natural y después surgió el peligro de olvidar hasta el nombre de las cosas. ¿Qué soy?",
  pistas: [
    "Los habitantes intentaron combatir mis efectos colocando etiquetas a los objetos.",
    "Soy una enfermedad que provoca insomnio y pérdida de memoria."
  ],
  respuesta: "La peste del insomnio"
}
];

const juego = document.getElementById("juego");

preguntas.forEach((p, i) => {
  const card = document.createElement("section");
  card.className = "card";

  const numero = document.createElement("div");
  numero.className = "numero";
  numero.textContent = "MISTERIO " + (i + 1);

  const titulo = document.createElement("h2");
  titulo.textContent = "¿Puedes descubrirlo?";

  const texto = document.createElement("p");
  texto.className = "pregunta";
  texto.textContent = p.pregunta;

  const botonPista = document.createElement("button");
  botonPista.className = "boton-pista";
  botonPista.textContent = "💡 Dame una pista";

  const pista = document.createElement("div");
  pista.className = "pista";

  const botonRespuesta = document.createElement("button");
  botonRespuesta.className = "boton-respuesta";
  botonRespuesta.textContent = "🌼 Revelar respuesta";

  const respuesta = document.createElement("div");
  respuesta.className = "respuesta";

  let nivel = 0;

  botonPista.addEventListener("click", () => {
    pista.style.display = "block";

    if (nivel < p.pistas.length) {
      pista.textContent =
        "Pista " + (nivel + 1) + ": " + p.pistas[nivel];
      nivel++;
    } else {
      pista.textContent =
        "Ya tienes las dos pistas. ¡Inténtalo una vez más!";
    }
  });

  botonRespuesta.addEventListener("click", () => {
    if (respuesta.style.display === "block") {
      respuesta.style.display = "none";
      botonRespuesta.textContent = "🌼 Revelar respuesta";
    } else {
      respuesta.textContent = "Respuesta: " + p.respuesta;
      respuesta.style.display = "block";
      botonRespuesta.textContent = "Ocultar respuesta";
    }
  });

  card.append(
    numero,
    titulo,
    texto,
    botonPista,
    pista,
    botonRespuesta,
    respuesta
  );

  juego.appendChild(card);
});
</script>

</body>
</html>
